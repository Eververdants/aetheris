[package]
name = "aetheris-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aetheris-core = { path = "../aetheris-core", version = "1.0.0" }
ctrlc = "3"
windows = { version = "0.62", features = [
  # Union of the four folded-in bins' windows features.
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# The four historical binaries (service, cli, ui, overlay) are now subcommands
# of this one binary. See src/main.rs (the dispatcher).
[[bin]]
name = "aetheris"
path = "src/main.rs"
